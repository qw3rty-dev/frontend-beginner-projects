<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <article class="profile-card">
        <div class="left-column">
            <header class="profile-header">
                <img src="profile_img.jpeg" 
                alt="Profile picture"
                class="profile-img"
                >
                <h1 class="name">Rishabh</h1>
                <p class="role">Backend Developer</p>
            </header>

            <section class="about">
                <p>I enjoy building reliable software systems, designing clean APIs, and creating efficient backend architecture.</p>
            </section>
            <section class="skills">
                <h2>What I work with</h2>
                <ul class ="tags">
                    <li>Python</li>
                    <li>FastAPI</li>
                    <li>PostgreSQL</li>
                    <li>SQLAlchemy</li>
                    <li>HTML</li>
                    <li>CSS</li>
                </ul>
                
            </section>
        </div>
        <div class="right-column">
            <footer class="profile-footer">
                
                <a href="https://github.com/qw3rty-dev" target="_blank" rel="noopener noreferrer">
                    GitHub 
                    <i class="fa-brands fa-github"></i>
                </a>
                <a href="https://open.spotify.com/user/31em5cwd2nge2wywcbxlyfjphb7q?si=ZEuaT0h_RHa64E3AJ97UeA&utm_source=copy-link" target="_blank" rel="noopener noreferrer">
                    Spotify 
                    <i class="fa-brands fa-spotify"></i>
                </a>
                <a href="https://www.facebook.com/share/1DSzHNqgUS/" target="_blank" rel="noopener noreferrer">
                    Facebook 
                    <i class="fa-brands fa-facebook"></i>
                </a>
                <a href="mailto:rishabh120805@gmail.com" target="_blank" rel="noopener noreferrer">
                    Email 
                    <i class="fa-regular fa-envelope"></i>
                </a>
            </footer>
        </div>
    </article>
</body>
</html>
